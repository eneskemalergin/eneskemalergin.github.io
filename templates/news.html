{% extends "base.html" %}

{% block content %}
{% set news_data = load_data(path="data/news.toml") %}

<h2>News</h2>

{% if news_data.news %}
<div class="news-list">
    {% for item in news_data.news %}
    <div class="news-item">
        <span class="news-date">{{ item.date }}</span>
        <span class="news-type news-type-{{ item.type }}">{{ item.type }}</span>
        <span class="news-content">{{ item.content | safe }}</span>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="empty">No news yet.</p>
{% endif %}
{% endblock %}
