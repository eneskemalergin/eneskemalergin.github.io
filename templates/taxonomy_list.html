{% extends "base.html" %}

{% block content %}
<h2>{{ taxonomy.name | title }}</h2>
<p class="section-desc">Browse the topic index and jump into individual tag archives.</p>

<div class="tag-cloud">
    {% for term in terms %}
    <a href="{{ term.permalink }}" class="tag tag-cloud-item">
        {{ term.name }}<sup>{{ term.pages | length }}</sup>
    </a>
    {% endfor %}
</div>
{% endblock %}
