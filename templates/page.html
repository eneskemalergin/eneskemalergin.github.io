{% extends "base.html" %}

{% block content %}
<article>
    <header class="page-header">
        <h1>{{ page.title }}</h1>
        {% if page.date %}
        <div class="page-meta">{{ page.date | date(format="%B %d, %Y") }}</div>
        {% endif %}
    </header>
    <div class="page-body">
        {{ page.content | safe }}
    </div>
</article>
{% endblock %}
