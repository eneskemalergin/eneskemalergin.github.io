# -- Teaching / Mentoring Schema Reference ---------------------------------------
#
# Each [[experiences]] entry supports these fields:
#
#   role        - "TA" | "Instructor" | "Tutor" | "Guest Lecturer" |
#                 "Workshop Leader" | "Mentor" | "Supervisor"
#   course      - Course name, number, or program title
#   institution - University or organization
#   date        - Date range string, e.g. "Sep 2022 - Apr 2022"
#   year        - Year (integer), used for sorting
#   department  - Department or faculty                         (optional)
#   level       - "Undergraduate" | "Graduate" | "Professional" (optional)
#   format      - "In-person" | "Online" | "Hybrid"             (optional)
#   description - Short summary of responsibilities             (optional)
#   highlights  - Array of key achievements or duties           (optional)
#   supervisor  - Faculty supervisor name                       (optional)
#   students    - Number of students (integer)                  (optional)
#   image       - Photo or logo path relative to static/        (optional)
#   tags        - Array of topic tags                           (optional)
#   featured    - Boolean, true to highlight this entry         (optional)
#   url         - Course or department URL                      (optional)
#   tag         - Blog tag slug for cross-linking; "NA" unassigned
#
# Rendering note: templates/research.html currently uses course, role, date,
# and institution. Other fields are stored in the data file but not yet surfaced.

