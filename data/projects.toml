# -- Project Schema Reference --------------------------------------------------
#
# Each [[projects]] entry supports these fields:
#
#   title     - Project display name
#   domain    - Functional area: "data-analysis" | "metadata" | "core-tooling" |
#               "language-dev" | "standards"
#   source    - Project origin: "langelab" | "zenteomics" | "personal"
#   status    - "mature" | "stable" | "active" | "wip" | "early" | "archived"
#               (also determines timeline stage grouping order)
#   stars     - GitHub star count (integer, 0 to hide)
#   version   - Semver string, e.g. "0.3.0".  Default "0.1.0" if omitted.
#   language  - "Python" | "R" | "Zig" | "Rust" | "C" | "C++" | "C#" |
#               "LaTeX" | "Go".  Jupyter Notebook is normalized to Python.
#   pub       - Publication status: "published" | "preprint" | "upcoming" |
#               "planned" | "na"
#   access    - Repository visibility: "public" | "private"
#   image     - Thumbnail path relative to static/  (optional)
#   tag       - Blog tag slug for cross-linking; "NA" means not yet assigned
#   tags      - Array of category tag strings        (optional)
#   desc      - Markdown description string          (optional)
#   github    - GitHub URL (primary/package repo; used in title link)
#   analysis  - Separate analysis/reproducibility repo URL (optional)
#   pkg       - Package registry URL: PyPI | Crates.io | CRAN | Bioconductor (optional)
#               Label and icon are auto-detected from the URL domain in the template.
#   docs      - Documentation URL                    (optional)
#   app       - Live application URL                 (optional)
#   paper     - Published paper DOI / URL            (optional)
#   preprint  - Preprint URL                         (optional)
#
# -- Head Badges (right-aligned, in order) -------------------------------------
#
#   1. Language badge     .lang-badge.lang-{Python|R|Zig|Rust|C|C++|C#|LaTeX|Go}
#        Python: #3776AB blue,         fa-python icon
#        R:      #276DC2 blue,         fa-r-project icon
#        Zig:    #d98e0d amber,        fa-code icon
#        Rust:   #DEA584 rust-orange,  fa-rust icon
#        C:      #555555 gray,         fa-code icon
#        C++:    #00599C blue,         fa-code icon
#        C#:     #68217A purple,       fa-code icon
#        LaTeX:  #008080 teal,         fa-file-lines icon
#        Go:     #00ADD8 light-blue,   fa-golang icon
#
#   2. Access badge       .access-badge.access-{public|private}
#        public:  #059669 green,       fa-lock-open icon
#        private: #d97706 amber,       fa-lock icon
#
#   3. Stars badge        .star-badge (log-normalized colour)
#        Colour computed by tools/star-colors.py using log normalisation
#        over the actual star-count range in this file.  Values inlined
#        as CSS custom properties (--clr, --clr-d, --bdr, --bdr-d, --bg, --bg-d).
#        Lowest count -> lightest red (#fca5a5), highest -> darkest (#b91c1c).
#
#   4. Version badge      .version-badge
#        Muted gray pill, no variant.
#
#   5. Publication badge  .pub-badge.pub-{published|preprint|upcoming|planned|na}
#        published: #059669 green,     fa-book icon
#        preprint:  #d97706 amber,     fa-file-lines icon
#        upcoming:  #2563eb blue,      fa-pen-fancy icon
#        planned:   #7c3aed purple,    fa-calendar icon
#        na:        #64748b gray,      fa-minus icon
#
# -- Left Column (under thumbnail) ---------------------------------------------
#
#   .project-domain    - Uppercase muted label ("DATA-ANALYSIS", "METADATA",
#                        "CORE-TOOLING", "LANGUAGE-DEV", "STANDARDS")
#   .project-source    - Uppercase muted label ("LANGELAB", "ZENTEOMICS",
#                        "PERSONAL")
#
# -- Dark Mode -----------------------------------------------------------------
#   All coloured badges have brighter/saturated dark-mode variants (see CSS).
#
# -- Notes ---------------------------------------------------------------------
#   - Language "Jupyter Notebook" is normalised to "Python" in the data.
#   - Every project should have pub and access set explicitly.
#   - Version is optional in the current template, but recommended for public
#     projects.
#   - Timeline order in templates/projects.html: mature -> stable -> active ->
#     wip -> early -> private -> archived.
#   - Star badge colour is computed by tools/star-colors.py with log
#     normalisation over the actual star count range in this file.
#   - Thumbnail is square 130 px (80 px on mobile), border-radius 6px,
#     1px border, with initial letter placeholder when no image.
#   - tag = "NA" means blog tag slug not yet assigned (fill later).
#   - Tag frequency cloud is generated into data/tag_frequencies.json by
#     tools/tag-freq.py.  Run ./build.sh instead of bare zola build/serve
#     to regenerate it.
#   - Star colours and tag frequencies are pre-processed in build.sh:
#       tools/tag-freq.py     -> data/tag_frequencies.json
#       tools/star-colors.py  -> data/project_stars.json
#   - The full badge rendering lives in sass/style.scss and
#     templates/projects.html.

