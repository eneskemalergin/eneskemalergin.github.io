# -- Project Schema Reference --------------------------------------------------
#
# Each [[projects]] entry supports these fields:
#
#   title     - Project display name
#   domain    - Functional area: "data-analysis" | "metadata" | "core-tooling" |
#               "language-dev" | "standards"
#   source    - Project origin: "langelab" | "zenteomics" | "personal"
#   status    - "mature" | "stable" | "active" | "wip" | "early" | "private" |
#               "archived" (also determines timeline stage grouping order;
#               any other value fails the build)
#   stars     - GitHub star count (integer, 0 to hide)
#   version   - Semver string, e.g. "0.3.0".  Badge is hidden if omitted.
#   language  - "Python" | "R" | "Zig" | "Rust" | "C" | "C++" | "C#" |
#               "LaTeX" | "Go".  Jupyter Notebook is normalized to Python.
#   pub       - Publication status: "published" | "preprint" | "upcoming" |
#               "planned" | "na"
#   access    - Repository visibility: "public" | "private"
#   image     - Thumbnail path relative to static/ (optional): a 256 x 256 PNG,
#               transparent, with the artwork scaled to fit and centred.
#               SVG sources stay local (git ignores *.svg); the site serves
#               their PNG renders so every browser shows the same pixels.
#   tag       - Blog tag slug for cross-linking: the title in lowercase without
#               hyphens (z-fasta -> "zfasta"); "NA" means not yet assigned
#   tags      - Array of category tag strings        (optional). Lowercase and
#               hyphenated; reuse a blog tag or one already used here before
#               adding a new one, and keep three to five per project
#   desc      - Plain-text description, HTML-escaped (optional)
#   github    - GitHub URL (primary/package repo; used in title link)
#   analysis  - Separate analysis/reproducibility repo URL (optional)
#   pkg       - Package registry URL: PyPI | Crates.io | CRAN | Bioconductor (optional)
#               Label and icon are auto-detected from the URL domain in the template.
#   docs      - Documentation URL                    (optional)
#   app       - Live application URL                 (optional)
#   paper     - Published paper DOI / URL            (optional)
#   preprint  - Preprint URL                         (optional)
#
#   Private rows (access = "private") never link to a repository or an
#   analysis repo. A lock chip takes the GitHub button's place, built from
#   two optional fields:
#   private_reason - "in-development" | "pending-publication" | "proprietary" |
#                    "internal", shown as "In development", "Waiting on the
#                    paper", "Proprietary", or "Lab internal". Any other value
#                    fails the build.
#   public_plan    - Short phrase that completes "public ...", e.g.
#                    "with v0.1.0" or "after the preprint"
#   With neither field the chip says "Source private", or "Not released yet"
#   for a row without github.
#
# -- Head Badges (right-aligned, in order) -------------------------------------
#
#   1. Language     from `language`; a known language has its own color and icon
#   2. Stars        from `stars`, only when stars > 0; tools/star-levels.py sets
#                   the badge's fill level (1 to 5) by log normalization over
#                   the star counts in this file
#   3. Version      from `version`, when set
#   4. Access       from `access`
#   5. Publication  from `pub`
#
#   Badge colors live in sass/style.scss and sass/_main.scss; icons are keys
#   of data/icons.toml, chosen in templates/projects.html.
#
# -- Left Column (under thumbnail) ---------------------------------------------
#
#   .project-domain    - Uppercase muted label ("DATA-ANALYSIS", "METADATA",
#                        "CORE-TOOLING", "LANGUAGE-DEV", "STANDARDS")
#   .project-source    - Uppercase muted label ("LANGELAB", "ZENTEOMICS",
#                        "PERSONAL")
#
# -- Notes ---------------------------------------------------------------------
#   - Language "Jupyter Notebook" is normalised to "Python" in the data.
#   - Every project should have pub and access set explicitly.
#   - Version is optional in the current template, but recommended for public
#     projects.
#   - Timeline order in templates/projects.html: mature -> stable -> active ->
#     wip -> early -> private -> archived.
#   - Within a stage, cards follow file order. Rows are kept by stage, then
#     published work first, then by domain (data-analysis, metadata,
#     standards, core-tooling, language-dev), then by stars.
#   - Thumbnail is square 130 px (80 px on mobile), border-radius 8px,
#     1px border, with initial letter placeholder when no image.
#   - tag = "NA" means blog tag slug not yet assigned (fill later).
#   - Tag frequency cloud is generated into data/generated/tag_frequencies.json by
#     tools/tag-freq.py.  Run ./build.sh instead of bare zola build/serve
#     to regenerate it.
#   - Star levels and tag frequencies are pre-processed in build.sh:
#       tools/tag-freq.py     -> data/generated/tag_frequencies.json
#       tools/star-levels.py  -> data/generated/project_stars.json
#   - The full badge rendering lives in sass/style.scss, sass/_main.scss,
#     and templates/projects.html.

