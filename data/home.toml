[[research]]
topic = "Transcriptomics & gene fusions"
desc = "Gene fusion calling from RNA-seq for clinical labs, through Zenteomics. FRAMEFusion, a pipeline for FFPE tissue, is in development."

[[research]]
topic = "Fast tools with a small memory footprint"
desc = "Mostly Zig. zmz reads mzML in 2.8 MiB of memory where OpenMS peaks at 597 MiB, mzDiff compares a 5.3 GiB Astral run in 17.1 s with 20.5 MB, and HarmonizePy runs batch correction 54 to 266 times faster than single-core HarmonizR."
