# -- Homepage Schema Reference ---------------------------------------------------
#
#   avatar    - Portrait path relative to static/
#   titles    - Lines under the name, one role each. Trusted HTML: links and
#               entities are rendered as written.
#   bio       - Plain-text paragraphs below the titles
#
# Each [[research]] entry is one topic under "Research interests":
#
#   topic     - Heading
#   desc      - Plain-text paragraph
#   papers    - Array of { name, venue, url }: the work's short name, then the
#               journal and year as the link text (optional)
#   software  - Array of project titles from data/projects.toml, linked to
#               their cards on the projects page (optional)

avatar = "portrait.jpg"

titles = [
    """Bioinformatician &amp; Systems Engineer""",
    """Founder at <a href="https://zenteomics.com/">Zenteomics</a> - <a href="https://github.com/Zenteomics">GitHub</a>""",
    """Consulting Bioinformatician for labs at <a href="https://bcchr.ca/">BCCHR</a>, VGH, and more""",
    """PhD, Bioinformatics. <a href="https://www.bioinformatics.ubc.ca/">University of British Columbia</a>""",
]

bio = [
    "I'm a bioinformatician in Vancouver. Most of my work is quantitative proteomics, often at the proteoform level and with pediatric cancer data. Zenteomics, my one-person practice, has added gene fusion calling from RNA-seq. What ties it together is resource use: large-scale analysis on smaller hardware, personal laptops included.",
]

[[research]]
topic = "Quantitative proteomics & proteoform biology"
desc = "Methods for finding proteoforms, the cleaved and modified forms of a protein that a protein-level average hides."
papers = [
    { name = "ProteoForge", venue = "J. Proteome Res., 2026", url = "https://pubs.acs.org/doi/10.1021/acs.jproteome.5c01235" },
    { name = "SQuAPP", venue = "Bioinformatics, 2022", url = "https://doi.org/10.1093/bioinformatics/btac628" },
    { name = "N-termini proteoforms (Weng et al.)", venue = "Mol. Cell. Proteomics, 2019", url = "https://www.mcponline.org/content/18/11/2335.abstract" },
    { name = "PhD thesis", venue = "UBC, 2025", url = "https://open.library.ubc.ca/cIRcle/collections/ubctheses/24/items/1.0448334" },
]

[[research]]
topic = "Statistical methods"
desc = "Statistics that hold up when values are missing, and equivalence tests that can show a protein did not change."
papers = [
    { name = "QuEStVar", venue = "J. Proteome Res., 2024", url = "https://doi.org/10.1021/acs.jproteome.4c00131" },
]
