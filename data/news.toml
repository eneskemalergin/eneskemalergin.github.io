# -- News Schema Reference -------------------------------------------------------
#
# Each [[news]] entry supports these fields:
#
#   date        - Month/year string, e.g. "04/2026"
#   type        - "publication" | "release" | "project" | "milestone" |
#                 "career" | "award" | "event" | "mentoring"
#   main-page   - Integer. 1 = shown on homepage, 0 = full news page only
#   content     - HTML-safe description with links
#
# Type guidance:
#   publication - Scholarly dissemination: published paper, preprint, or
#                 manuscript submitted for peer review.
#   release     - A public software or data availability event, including a
#                 package published to a registry or a project open-sourced.
#   project     - A meaningful software or community-project development
#                 update, such as starting work, reaching feature completeness,
#                 or entering an external review process. This is not a personal
#                 or academic achievement category.
#   milestone   - A completed personal, academic, or organizational achievement,
#                 such as defending a PhD or founding an initiative. Do not use
#                 it for routine project progress or planned work.
#   career      - A role, appointment, or employment change.
#   award       - An award, fellowship, or other formal recognition.
#   event       - A talk, workshop, conference, or other attended event.
#   mentoring   - A teaching, supervision, or mentoring activity.
#
# `type` categorizes the update; it does not indicate importance. Use
# `main-page = 1` selectively for updates that deserve homepage visibility.
# Keep entries newest first. Use concise, factual content and link the relevant
# public project, publication, or organization when a stable URL exists.
# For software updates, include a confirmed event-time version inline as
# `(vX.Y.Z)`. Keep that historical version unchanged when the project advances.
#
# Homepage renders entries with main-page = 1.
# /news page renders all entries, newest first.

