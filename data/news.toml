# -- News Schema Reference -------------------------------------------------------
#
# Each [[news]] entry supports these fields:
#
#   date        - Month/year string, e.g. "04/2026"
#   type        - "publication" | "release" | "milestone" | "career" |
#                 "award" | "event" | "mentoring"
#   main-page   - Integer. 1 = shown on homepage, 0 = full news page only
#   content     - HTML-safe description with links
#
# Homepage renders entries with main-page = 1.
# /news page renders all entries, newest first.

