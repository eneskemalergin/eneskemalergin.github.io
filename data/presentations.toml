# -- Presentation Schema Reference ------------------------------------------------
#
# Each [[presentations]] entry supports these fields:
#
#   title       - Presentation title
#   type        - "Oral" | "Poster" | "Workshop" | "Invited Talk" | "Lecture" |
#                 "Keynote" | "Panel"
#   role        - "Presenter" | "First Author" | "Speaker" | "Co-author"
#                                                                     (optional)
#   date        - Month + year string, e.g. "Jun 2023"
#   year        - Year (integer), used for timeline grouping
#   venue       - Conference, event, or institution name
#   event       - Broader event / conference name                  (optional)
#   location    - City, Province/State, Country
#   coauthors   - Array of co-author names                         (optional)
#   doi         - DOI if the presentation has a published abstract (optional)
#   award       - Award won for the presentation                   (optional)
#   links       - Array of { label, url } for slides, recording    (optional)
#   description - Short abstract or summary                        (optional)
#   image       - Photo or figure path relative to static/         (optional)
#   tags        - Array of topic tags                              (optional)
#   featured    - Boolean, true to highlight this entry            (optional)
#   url         - External page for more details                   (optional)
#   tag         - Blog tag slug for cross-linking; "NA" unassigned
#
# Rendering note: templates/research.html currently uses title, type, date,
# venue, and location only. Workshop and Poster have distinct visual treatments.

