<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 122" width="160" height="122" role="img" aria-labelledby="title description">
  <title id="title">z-fastq</title>
  <desc id="description">The name z-fastq as an orange lightning Z, a hyphen, and the letters f, s, and t, with the letter a drawn as the orange plus sign of a FASTQ record and the letter q as an orange at sign whose stem falls into the tail of a q.</desc>
  <rect x="2.5" y="2.5" width="155" height="117" rx="27" fill="#151515" stroke="#f7a41d" stroke-width="3"/>
  <!-- The lightning Z, as in z-fasta -->
  <g fill="#f7a41d" transform="matrix(0.2838,0,0,0.2838,4.55,41.39)">
    <polygon points="62,36 37,44 56,22"/>
    <polygon points="37,44 56,32 56,22 111,22 111,44"/>
    <polygon points="97,117 90,104 116,95"/>
    <polygon points="42,117 42,95 116,95 100,104 97,117"/>
    <polygon points="150,0 52,117 3,140 101,22"/>
  </g>
  <!-- -f st: the letters between the marks -->
  <text x="35.4" y="72.3" fill="#f4eed7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="33.8" font-weight="700" xml:space="preserve">-f st</text>
  <g fill="none" stroke="#f7a41d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- + for a: the separator line of a FASTQ record -->
    <path d="M86.3,56.4 V70.2 M79.4,63.3 H93.2" stroke-width="3.9"/>
    <!-- @ for q: the bowl and right stem make a q, the stem falls below the baseline as its tail, and the ring wraps it into the header marker -->
    <circle cx="145.5" cy="62.7" r="3.6"/>
    <path d="M149.1,58.8 V75.8 Q149.1,80.3 153.6,80.3"/>
    <path d="M149.1,66.2 C150.6,68.9 154.3,68.1 154.3,62.6 C154.3,57.3 150.6,54.0 146.0,54.0 C141.2,54.0 137.5,57.8 137.5,62.7 C137.5,67.6 141.3,71.2 146.0,71.2"/>
  </g>
</svg>
