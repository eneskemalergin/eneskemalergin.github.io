    <text
       x="119.86301"
       y="187.18182"
       text-anchor="middle"
       font-family="Inter, 'Segoe UI', system-ui, '-apple-system', sans-serif"
       font-size="44.1981px"
       id="text24"
       style="stroke-width:1.38119"><tspan
