name: Build and deploy

on:
  push:
    branches: [master, main]
  # Pull requests build and check the site but never deploy it.
  pull_request:

# Actions are pinned to full commit SHAs; the comment names the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Zola
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: zola@0.22.1
      - name: Build site
        run: ./build.sh build
        env:
          PYTHON: python
      - name: Check internal links
        run: python tools/check-links.py public
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish to Pages or request an OIDC token.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
